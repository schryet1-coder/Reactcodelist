name: CI & Deploy to InfinityFree

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, bcmath, pcntl, xml, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

      - name: Install NPM and build (if package.json present)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build || true
          fi

      - name: Run tests
        run: php artisan test --no-coverage

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install composer dependencies (production)
        run: composer install --prefer-dist --no-dev --no-progress --no-suggest --no-interaction

      - name: Build frontend
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build || true
          fi

      - name: Prepare deploy directories
        run: |
          rm -rf deploy || true
          mkdir -p deploy/laravel_app
          mkdir -p deploy/htdocs
          # Copy everything except the public folder into laravel_app
          rsync -av --exclude='deploy' --exclude='.git' --exclude='public' --exclude='.github' --exclude='node_modules' --exclude='tests' --exclude='.env' ./ deploy/laravel_app/
          # Copy public into htdocs (public web root)
          rsync -av public/ deploy/htdocs/

      - name: Make deploy script executable
        run: chmod +x scripts/prepare_deploy.sh

      - name: Create deploy artifact
        run: |
          mkdir -p artifacts
          ./scripts/prepare_deploy.sh artifacts/deploy.zip

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: artifacts/deploy.zip

      - name: Upload htdocs to InfinityFree
        if: ${{ secrets.INF_FTP_HOST && secrets.INF_FTP_USERNAME && secrets.INF_FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.INF_FTP_HOST }}
          username: ${{ secrets.INF_FTP_USERNAME }}
          password: ${{ secrets.INF_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: deploy/htdocs
          server-dir: /htdocs

      - name: Upload laravel_app to InfinityFree
        if: ${{ secrets.INF_FTP_HOST && secrets.INF_FTP_USERNAME && secrets.INF_FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.INF_FTP_HOST }}
          username: ${{ secrets.INF_FTP_USERNAME }}
          password: ${{ secrets.INF_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: deploy/laravel_app
          server-dir: /htdocs/laravel_app
